<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Formulário - Olimpíadas de Inverno</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
          <a class="navbar-brand" href="index.html">Minha Rotina</a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="#inicio">Início</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#montar">Montar rotina</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="./dicas.html">Dicas</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="titulo-pagina">
        <div class="container">
          <p class="subtitulo">PARTICIPE!</p>
          <h1>Formulário</h1>
          <p>Conte um pouco sobre você e seu esporte favorito.</p>
        </div>
      </section>

      <section class="container formulario-conteudo">
        <div class="formulario-caixa">
          <h2>Vamos conversar?</h2>

          <p>Preencha os campos abaixo para participar.</p>

          <form id="formulario">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome completo:</label>
              <input
                type="text"
                class="form-control"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail:</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="exemplo@email.com"
                required
              />
            </div>

            <div class="mb-3">
              <label for="idade" class="form-label">Idade:</label>
              <input
                type="number"
                class="form-control"
                id="idade"
                name="idade"
                min="10"
                max="120"
                step="1"
                placeholder="Digite sua idade"
                required
              />

              <small class="texto-idade">
                A idade mínima para participar é de 10 anos.
              </small>
            </div>

            <div class="mb-3">
              <label for="esporte" class="form-label">
                Qual é seu esporte favorito?
              </label>

              <select class="form-select" id="esporte" name="esporte" required>
                <option value="">Escolha uma opção</option>
                <option value="Esqui">Esqui</option>
                <option value="Snowboard">Snowboard</option>
                <option value="Patinação artística">Patinação artística</option>
                <option value="Hóquei no gelo">Hóquei no gelo</option>
                <option value="Bobsled">Bobsled</option>
                <option value="Outro">Outro</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="mensagem" class="form-label">
                O que você mais gosta nas Olimpíadas de Inverno?
              </label>

              <textarea
                class="form-control"
                id="mensagem"
                name="mensagem"
                rows="4"
                placeholder="Escreva sua resposta..."
                required
              ></textarea>
            </div>

            <button type="submit" class="btn btn-principal">
              Enviar formulário
            </button>

            <p
              id="resposta-formulario"
              class="mt-3"
              role="status"
              aria-live="polite"
            ></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
      <p class="mb-0">ORGANIZE A SUA ROTINA</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
